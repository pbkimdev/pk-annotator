map $uri $pka_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/pk-annotator-site;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/markdown application/javascript application/json image/svg+xml application/manifest+json;

    add_header Cache-Control $pka_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /install.sh {
        types { }
        default_type text/plain;
    }

    location = /agents.md {
        types { }
        default_type text/markdown;
    }

    location ~ \.vtt$ {
        types { }
        default_type text/vtt;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
